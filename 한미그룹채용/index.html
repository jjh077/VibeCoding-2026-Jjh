<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한미그룹 2026년 하반기 공개채용</title>
<meta name="description" content="한미그룹 2026년 하반기 공개채용. 모집기간 2026.9.28(월) ~ 2026.10.18(일) 23:59까지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body, h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  a { color: inherit; text-decoration: none; }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- Design tokens ---------- */
  :root {
    --white: #ffffff;
    --black: #000000;
    --red: #e60012;
    --orange: #ff5d32;
    --font: 'Inter', 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --ease: 0.2s ease;
    --container: 1440px;
    --viewport-max: 1920px;
  }

  html { scroll-behavior: smooth; }
  body {
    min-width: var(--container);
    font-family: var(--font);
    color: var(--black);
    background: var(--white);
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header (공통 레이아웃 / 헤더) ---------- */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100px;
    z-index: 10;
  }
  .header__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: var(--container);
    height: 100%;
    margin: 0 auto;
    padding: 0 60px;
  }
  .brand { display: flex; align-items: center; height: 100px; }
  .brand img { width: 182px; height: 31px; }

  .gnb { display: flex; align-items: center; }
  .gnb__list { display: flex; gap: 40px; height: 100px; }
  .gnb__item { display: flex; align-items: center; height: 100px; }
  .gnb__link {
    font-size: 19.2px;
    font-weight: 600;
    line-height: 20px;
    letter-spacing: -0.4px;
    color: var(--black);
    transition: color var(--ease);
  }
  .gnb__link:hover,
  .gnb__link:focus-visible { color: var(--red); }

  .gnb__apply { padding-left: 40px; }

  /* ---------- Buttons ---------- */
  .btn-apply {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 119px;
    height: 48px;
    padding: 0 20px;
    border: 1px solid var(--red);
    border-radius: 500px;
    background: var(--red);
    color: var(--white);
    font-size: 17.4px;
    font-weight: 600;
    line-height: 18px;
    letter-spacing: -0.36px;
    transition: background-color var(--ease), color var(--ease), border-color var(--ease);
  }
  .btn-apply svg { width: 7px; height: 12px; flex: none; }
  .btn-apply:hover,
  .btn-apply:focus-visible { background: var(--white); color: var(--red); }

  /* 주요 CTA: gradient는 transition이 안 되므로 오버레이로 반전 처리 */
  .btn-cta {
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 303px;
    max-width: 303px;
    height: 72px;
    padding: 18.7px 64px 19.3px;
    border: 2px solid transparent;
    border-radius: 500px;
    background: linear-gradient(90deg, var(--red) 0%, var(--orange) 100%);
    background-origin: border-box;
    color: var(--white);
    font-size: 22.7px;
    font-weight: 600;
    line-height: 34px;
    letter-spacing: -0.48px;
    white-space: nowrap;
    overflow: hidden;
    transition: color var(--ease), border-color var(--ease);
  }
  .btn-cta::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--white);
    opacity: 0;
    transition: opacity var(--ease);
  }
  .btn-cta:hover,
  .btn-cta:focus-visible { color: var(--red); border-color: var(--red); }
  .btn-cta:hover::before,
  .btn-cta:focus-visible::before { opacity: 1; }

  /* ---------- Main visual ---------- */
  .main-visual {
    position: relative;
    width: 100%;
    max-width: var(--viewport-max);
    height: 900px;
    min-height: 720px;
    margin: 0 auto;
    overflow: hidden;
  }
  .main-visual__bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: url('./images/mv_bg_png.png') center / cover no-repeat;
  }
  .main-visual__inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    max-width: var(--container);
    height: 100%;
    margin: 0 auto;
    padding: 0 0 0 100px;
  }

  /* Copy */
  .mv-copy {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 80px;
    width: 560px;
  }
  .mv-copy__text { display: flex; flex-direction: column; align-items: flex-start; gap: 31.9px; }
  .mv-copy__eyebrow {
    font-size: 31.1px;
    font-weight: 700;
    line-height: 45px;
    letter-spacing: -0.64px;
  }
  .mv-copy__title { display: flex; flex-direction: column; }
  .mv-copy__brand {
    font-size: 72.3px;
    font-weight: 800;
    line-height: 76px;
    letter-spacing: -1.76px;
  }
  .mv-copy__sub {
    font-size: 45.8px;
    font-weight: 800;
    line-height: 72px;
    letter-spacing: -1.12px;
  }
  .mv-copy__period {
    font-size: 19.2px;
    font-weight: 500;
    line-height: 28px;
    letter-spacing: -0.4px;
  }

  /* Stage: 원형 글라스 + 캐릭터 (1440 컨테이너 기준 좌표) */
  .mv-stage {
    position: absolute;
    top: 0; left: 0;
    width: var(--container);
    height: 900px;
    z-index: 1;
    pointer-events: none;
  }
  .mv-stage__glass {
    position: absolute;
    left: 700px; top: 118px;
    width: 663px; height: 663px;
    border: 5px solid var(--white);
    border-radius: 500px;
    background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
    filter: blur(5px);
    z-index: 1;
  }
  .mv-stage__ring {
    position: absolute;
    left: 755px; top: 173px;
    width: 553px; height: 553px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 500px;
    z-index: 2;
  }
  .mv-stage img { position: absolute; max-width: none; z-index: 3; }
  .mv-stage .micro { left: 765.8px;  top: 151.7px; width: 289.5px; height: 221.8px; z-index: 3; }
  .mv-stage .char1 { left: 815.1px;  top: 295.1px; width: 253.4px; height: 395.1px; z-index: 4; }
  .mv-stage .char2 { left: 1036.8px; top: 293.4px; width: 181.3px; height: 381.0px; z-index: 4; }
  .mv-stage .char3 { left: 739.4px;  top: 469.4px; width: 216.5px; height: 262.2px; z-index: 5; }
  .mv-stage .char4 { left: 1095.8px; top: 490.5px; width: 292.2px; height: 206.8px; z-index: 5; }

  /* Sparkle stars (CSS 4-point star) */
  .star {
    position: absolute;
    z-index: 6;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  }
  .star--blue   { left: 921.6px;  top: 237.0px; width: 17.6px;  height: 16.7px;  background: #cfe9ff; }
  .star--red    { left: 1160.9px; top: 249.4px; width: 23.8px;  height: 24.6px;  background: #f2452f; }
  .star--gold-l { left: 1332.5px; top: 432.4px; width: 34.3px;  height: 35.2px;  background: #ffc21a; }
  .star--gold-s { left: 1314.9px; top: 474.6px; width: 21.1px;  height: 21.1px;  background: #ffc21a; }
  .star--purple { left: 740.3px;  top: 469.4px; width: 22.9px;  height: 23.8px;  background: #9a5cf0; }

  /* Scroll button */
  .btn-scroll {
    position: absolute;
    left: 50%;
    bottom: 64px;
    z-index: 5;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    border-radius: 500px;
    background: rgba(255,255,255,0.1);
    box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4), inset -4px -4px 10px rgba(0,0,0,0.1);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    color: var(--white);
    transition: background-color var(--ease), color var(--ease);
  }
  .btn-scroll svg { width: 40px; height: 40px; }
  .btn-scroll:hover,
  .btn-scroll:focus-visible { background: var(--white); color: var(--red); }

  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header__inner">
    <a class="brand" href="#" aria-label="한미그룹 홈">
      <img src="./images/logo_svg.svg" alt="Hanmi 한미그룹" width="182" height="31">
    </a>

    <nav class="gnb" aria-label="주요 메뉴">
      <ul class="gnb__list">
        <li class="gnb__item"><a class="gnb__link" href="#">직무소개</a></li>
        <li class="gnb__item"><a class="gnb__link" href="#">지원자격 및 접수방법</a></li>
        <li class="gnb__item"><a class="gnb__link" href="#">채용설명회 일정</a></li>
      </ul>
      <div class="gnb__apply">
        <a class="btn-apply" href="#">
          <span>지원하기</span>
          <svg viewBox="0 0 7 12" fill="none" aria-hidden="true">
            <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </nav>
  </div>
</header>

<main>
  <section class="main-visual" id="main-visual" aria-labelledby="mv-title">
    <div class="main-visual__bg" aria-hidden="true"></div>

    <div class="main-visual__inner">
      <div class="mv-copy">
        <div class="mv-copy__text">
          <p class="mv-copy__eyebrow">2026년 하반기</p>
          <h1 class="mv-copy__title" id="mv-title">
            <span class="mv-copy__brand">한미그룹</span>
            <span class="mv-copy__sub">공개채용</span>
          </h1>
          <p class="mv-copy__period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
        </div>
        <a class="btn-cta" href="#">모집직무 바로가기!</a>
      </div>

      <div class="mv-stage" role="img" aria-label="현미경과 실험 도구 사이에서 일하는 한미그룹 캐릭터들">
        <div class="mv-stage__glass"></div>
        <div class="mv-stage__ring"></div>

        <img class="micro" src="./images/mv_micro_png.png" alt="">
        <img class="char1" src="./images/mv_char1_png.png" alt="">
        <img class="char2" src="./images/mv_char2_png.png" alt="">
        <img class="char3" src="./images/mv_char3_png.png" alt="">
        <img class="char4" src="./images/mv_char4_png.png" alt="">

        <span class="star star--blue"></span>
        <span class="star star--red"></span>
        <span class="star star--gold-l"></span>
        <span class="star star--gold-s"></span>
        <span class="star star--purple"></span>
      </div>
    </div>

    <button class="btn-scroll" type="button" id="scrollDown" aria-label="아래로 스크롤">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M12 16l8 8 8-8" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </section>
</main>

<script>
  (function () {
    var btn = document.getElementById('scrollDown');
    var hero = document.getElementById('main-visual');
    if (btn && hero) {
      btn.addEventListener('click', function () {
        window.scrollTo({ top: hero.offsetHeight, behavior: 'smooth' });
      });
    }
    // 디자인 단계: 빈 앵커(#) 클릭 시 페이지 상단 점프 방지
    document.querySelectorAll('a[href="#"]').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); });
    });
  })();
</script>
</body>
</html>
