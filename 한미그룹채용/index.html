<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>한미그룹 2026년 하반기 공개채용</title>
    <meta
      name="description"
      content="한미그룹 2026년 하반기 공개채용. 모집기간 2026.9.28(월) ~ 2026.10.18(일) 23:59까지"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- Reset ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      h1,
      h2,
      h3,
      p,
      ul,
      ol,
      figure {
        margin: 0;
        padding: 0;
      }
      ul,
      ol {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img,
      svg {
        display: block;
        max-width: 100%;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      /* ---------- Design tokens ---------- */

      /* CSS변수구역 */
      /* :root{변수코드}
    1. 변수설정방법
    --변수명: 값;
    변수명은 케밥케이스로 주로 씀
    (케밥케이스란? 마이너스 기호로 연결된 변수법)
    2. 변수호출방법
    var(변수명)
    쓰고 싶은 곳에 값으로 변수를 사용함.
  */
      :root {
        --white: #ffffff;
        --black: #000000;
        --red: #e60012;
        --orange: #ff5d32;
        --font:
          "Inter", "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
        --ease: 0.2s ease;
        --container: 1440px;
        --viewport-max: 1920px;
      }

      html {
        scroll-behavior: smooth;
      }
      body {
        min-width: var(--container);
        font-family: var(--font);
        color: var(--black);
        background: var(--white);
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- Header (공통 레이아웃 / 헤더) ---------- */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100px;
        z-index: 10;
      }
      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: var(--container);
        height: 100%;
        margin: 0 auto;
        padding: 0 60px;
      }
      .brand {
        display: flex;
        align-items: center;
        height: 100px;
      }
      .brand img {
        width: 182px;
        height: 31px;
      }

      .gnb {
        display: flex;
        align-items: center;
      }
      .gnb__list {
        display: flex;
        gap: 40px;
        height: 100px;
      }
      .gnb__item {
        display: flex;
        align-items: center;
        height: 100px;
      }
      .gnb__link {
        font-size: 19.2px;
        font-weight: 600;
        line-height: 20px;
        letter-spacing: -0.4px;
        color: var(--black);
        transition: color var(--ease);
      }
      .gnb__link:hover,
      .gnb__link:focus-visible {
        color: var(--red);
      }

      .gnb__apply {
        padding-left: 40px;
      }

      /* 모바일 전용 요소: 데스크탑/태블릿에서는 숨김 */
      .header__mo,
      .gnb__head,
      .gnb__char {
        display: none;
      }

      /* ---------- Buttons ---------- */
      .btn-apply {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 119px;
        height: 48px;
        padding: 0 20px;
        border: 1px solid var(--red);
        border-radius: 500px;
        background: var(--red);
        color: var(--white);
        font-size: 17.4px;
        font-weight: 600;
        line-height: 18px;
        letter-spacing: -0.36px;
        transition:
          background-color var(--ease),
          color var(--ease),
          border-color var(--ease);
      }
      .btn-apply svg {
        width: 7px;
        height: 12px;
        flex: none;
      }
      .btn-apply:hover,
      .btn-apply:focus-visible {
        background: var(--white);
        color: var(--red);
      }

      /* 주요 CTA: gradient는 transition이 안 되므로 오버레이로 반전 처리 */
      .btn-cta {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 303px;
        max-width: 303px;
        height: 72px;
        padding: 18.7px 64px 19.3px;
        border: 2px solid transparent;
        border-radius: 500px;
        background: linear-gradient(90deg, var(--red) 0%, var(--orange) 100%);
        background-origin: border-box;
        color: var(--white);
        font-size: 22.7px;
        font-weight: 600;
        line-height: 34px;
        letter-spacing: -0.48px;
        white-space: nowrap;
        overflow: hidden;
        transition:
          color var(--ease),
          border-color var(--ease);
      }
      .btn-cta::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--white);
        opacity: 0;
        transition: opacity var(--ease);
      }
      .btn-cta:hover,
      .btn-cta:focus-visible {
        color: var(--red);
        border-color: var(--red);
      }
      .btn-cta:hover::before,
      .btn-cta:focus-visible::before {
        opacity: 1;
      }

      /* ---------- Main visual ---------- */
      .main-visual {
        position: relative;
        width: 100%;
        max-width: var(--viewport-max);
        height: 900px;
        min-height: 720px;
        margin: 0 auto;
        overflow: hidden;
      }
      .main-visual__bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: url("./images/mv_bg_png.png") center / cover no-repeat;
      }
      .main-visual__inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        max-width: var(--container);
        height: 100%;
        margin: 0 auto;
        padding: 0 0 0 100px;
      }

      /* Copy */
      .mv-copy {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 80px;
        width: 560px;
      }
      .mv-copy__text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 31.9px;
      }
      .mv-copy__eyebrow {
        font-size: 31.1px;
        font-weight: 700;
        line-height: 45px;
        letter-spacing: -0.64px;
      }
      .mv-copy__title {
        display: flex;
        flex-direction: column;
      }
      .mv-copy__brand {
        font-size: 72.3px;
        font-weight: 800;
        line-height: 76px;
        letter-spacing: -1.76px;
      }
      .mv-copy__sub {
        font-size: 45.8px;
        font-weight: 800;
        line-height: 72px;
        letter-spacing: -1.12px;
      }
      .mv-copy__period {
        font-size: 19.2px;
        font-weight: 500;
        line-height: 28px;
        letter-spacing: -0.4px;
      }

      /* Stage: 원형 글라스 + 캐릭터 (1440 컨테이너 기준 좌표) */
      .mv-stage {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--container);
        height: 900px;
        z-index: 1;
        pointer-events: none;
      }
      .mv-stage__glass {
        position: absolute;
        left: 700px;
        top: 118px;
        width: 663px;
        height: 663px;
        border: 5px solid var(--white);
        border-radius: 500px;
        background: radial-gradient(
          70.71% 70.71% at 50% 50%,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0) 100%
        );
        filter: blur(5px);
        z-index: 1;
      }
      .mv-stage__ring {
        position: absolute;
        left: 755px;
        top: 173px;
        width: 553px;
        height: 553px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 500px;
        z-index: 2;
      }
      .mv-stage img {
        position: absolute;
        max-width: none;
        z-index: 3;
      }
      .mv-stage .micro {
        left: 765.8px;
        top: 151.7px;
        width: 289.5px;
        height: 221.8px;
        z-index: 3;
      }
      .mv-stage .char1 {
        left: 815.1px;
        top: 295.1px;
        width: 253.4px;
        height: 395.1px;
        z-index: 4;
      }
      .mv-stage .char2 {
        left: 1036.8px;
        top: 293.4px;
        width: 181.3px;
        height: 381px;
        z-index: 4;
      }
      .mv-stage .char3 {
        left: 739.4px;
        top: 469.4px;
        width: 216.5px;
        height: 262.2px;
        z-index: 5;
      }
      .mv-stage .char4 {
        left: 1095.8px;
        top: 490.5px;
        width: 292.2px;
        height: 206.8px;
        z-index: 5;
      }

      /* Sparkle stars (CSS 4-point star) */
      .star {
        position: absolute;
        z-index: 6;
        clip-path: polygon(
          50% 0,
          62% 38%,
          100% 50%,
          62% 62%,
          50% 100%,
          38% 62%,
          0 50%,
          38% 38%
        );
      }
      .star--blue {
        left: 921.6px;
        top: 237px;
        width: 17.6px;
        height: 16.7px;
        background: #cfe9ff;
      }
      .star--red {
        left: 1160.9px;
        top: 249.4px;
        width: 23.8px;
        height: 24.6px;
        background: #f2452f;
      }
      .star--gold-l {
        left: 1332.5px;
        top: 432.4px;
        width: 34.3px;
        height: 35.2px;
        background: #ffc21a;
      }
      .star--gold-s {
        left: 1314.9px;
        top: 474.6px;
        width: 21.1px;
        height: 21.1px;
        background: #ffc21a;
      }
      .star--purple {
        left: 740.3px;
        top: 469.4px;
        width: 22.9px;
        height: 23.8px;
        background: #9a5cf0;
      }

      /* Scroll button */
      .btn-scroll {
        position: absolute;
        left: 50%;
        bottom: 64px;
        z-index: 5;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        border-radius: 500px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow:
          inset 4px 4px 10px rgba(255, 255, 255, 0.4),
          inset -4px -4px 10px rgba(0, 0, 0, 0.1);
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
        color: var(--white);
        transition:
          background-color var(--ease),
          color var(--ease);
      }
      .btn-scroll svg {
        width: 40px;
        height: 40px;
      }
      .btn-scroll:hover,
      .btn-scroll:focus-visible {
        background: var(--white);
        color: var(--red);
      }

      :focus-visible {
        outline: 2px solid var(--red);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        * {
          transition: none !important;
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* =====================================================
     Responsive (Desktop First)
     - Desktop : 1025px 이상 (위 기본 스타일)
     - Tablet  : max-width 1024px
     - Mobile  : max-width 390px
     ===================================================== */

      /* ---------- Tablet ---------- */
      @media (max-width: 1024px) {
        body {
          min-width: 0;
        }

        /* Header */
        .header {
          overflow: hidden;
        }
        .header__inner {
          padding: 0 clamp(20px, 3.9vw, 40px);
        }
        .brand img {
          width: clamp(110px, 14.84vw, 152px);
          height: auto;
        }
        .gnb__list {
          gap: clamp(16px, 2.93vw, 30px);
        }
        .gnb__link {
          font-size: clamp(14px, 1.66vw, 17px);
          letter-spacing: -0.36px;
        }
        .gnb__apply {
          padding-left: clamp(12px, 2.34vw, 24px);
        }
        .btn-apply {
          height: 44px;
          font-size: 15px;
          letter-spacing: -0.3px;
        }

        /* Main visual: 텍스트 위 / 스테이지 아래 세로 배치 */
        .main-visual {
          height: auto;
          min-height: 0;
        }
        .main-visual__inner {
          height: auto;
          justify-content: flex-start;
          padding: 100px clamp(20px, 3.9vw, 40px) 80px;
        }

        .mv-copy {
          gap: 40px;
          width: 100%;
          max-width: 560px;
        }
        .mv-copy__text {
          gap: 20px;
        }
        .mv-copy__eyebrow {
          font-size: 27px;
          line-height: 40px;
          letter-spacing: -0.56px;
        }
        .mv-copy__brand {
          font-size: 56px;
          line-height: 60px;
          letter-spacing: -1.4px;
        }
        .mv-copy__sub {
          font-size: 34px;
          line-height: 56px;
          letter-spacing: -0.84px;
        }

        .btn-cta {
          width: 100%;
          height: 64px;
          padding: 0 40px;
          font-size: 20px;
          line-height: 28px;
          letter-spacing: -0.42px;
        }

        /* Stage: 1440 고정 좌표 → 스테이지 박스(690×663) 기준 % 좌표로 변환 (비율 유지) */
        .mv-stage {
          position: relative;
          top: auto;
          left: auto;
          width: 100%;
          max-width: 480px;
          height: auto;
          aspect-ratio: 690 / 663;
          align-self: center;
          margin-top: 30px;
        }
        .mv-stage__glass {
          left: 0;
          top: 0;
          width: 96.09%;
          height: 100%;
        }
        .mv-stage__ring {
          left: 7.97%;
          top: 8.3%;
          width: 80.14%;
          height: 83.41%;
        }
        .mv-stage .micro {
          left: 9.54%;
          top: 5.08%;
          width: 41.96%;
          height: 33.45%;
        }
        .mv-stage .char1 {
          left: 16.68%;
          top: 26.71%;
          width: 36.72%;
          height: 59.59%;
        }
        .mv-stage .char2 {
          left: 48.81%;
          top: 26.46%;
          width: 26.28%;
          height: 57.47%;
        }
        .mv-stage .char3 {
          left: 5.71%;
          top: 53%;
          width: 31.38%;
          height: 39.55%;
        }
        .mv-stage .char4 {
          left: 57.36%;
          top: 56.18%;
          width: 42.35%;
          height: 31.19%;
        }
        .star--blue {
          left: 32.12%;
          top: 17.95%;
          width: 2.55%;
          height: 2.52%;
        }
        .star--red {
          left: 66.8%;
          top: 19.82%;
          width: 3.45%;
          height: 3.71%;
        }
        .star--gold-l {
          left: 91.67%;
          top: 47.42%;
          width: 4.97%;
          height: 5.31%;
        }
        .star--gold-s {
          left: 89.12%;
          top: 53.79%;
          width: 3.06%;
          height: 3.18%;
        }
        .star--purple {
          left: 5.84%;
          top: 53%;
          width: 3.32%;
          height: 3.59%;
        }

        .btn-scroll {
          bottom: 32px;
          width: 60px;
          height: 60px;
        }
        .btn-scroll svg {
          width: 30px;
          height: 30px;
        }
      }

      /* ---------- Mobile ---------- */
      @media (max-width: 568px) {
        /* Header */
        .header {
          height: 64px;
        }
        .header__inner {
          padding: 0 22px;
        }
        .brand {
          height: 64px;
        }
        .brand img {
          width: 120px;
        }

        .header__mo {
          display: flex;
          align-items: center;
          gap: 2px;
        }
        .header__mo .btn-apply {
          width: 72px;
          height: 32px;
          padding: 0;
          font-size: 13px;
          letter-spacing: -0.26px;
        }
        .btn-menu,
        .btn-menu-close {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 44px;
          height: 44px;
          margin-right: -10px;
        }
        .btn-menu svg,
        .btn-menu-close svg {
          width: 24px;
          height: 24px;
        }

        /* 전체메뉴: 오른쪽에서 슬라이드 */
        .gnb {
          position: fixed;
          top: 0;
          right: 0;
          z-index: 100;
          flex-direction: column;
          align-items: stretch;
          width: 100%;
          height: 100vh;
          height: 100dvh;
          padding: 0 22px;
          background: var(--white);
          overflow-y: auto;
          overscroll-behavior: contain;
          transform: translateX(100%);
          visibility: hidden;
          transition:
            transform 0.3s ease,
            visibility 0s linear 0.3s;
        }
        .gnb.is-open {
          transform: translateX(0);
          visibility: visible;
          transition-delay: 0s;
        }
        html.is-menu-open,
        html.is-menu-open body {
          overflow: hidden;
        }

        .gnb__head {
          display: flex;
          flex: none;
          align-items: center;
          justify-content: space-between;
          height: 64px;
        }
        .gnb__list {
          flex-direction: column;
          gap: 0;
          height: auto;
          margin-top: 48px;
        }
        .gnb__item {
          height: 64px;
          border-bottom: 1px solid #e5e5e5;
        }
        .gnb__link {
          flex: 1;
          font-size: 20px;
          letter-spacing: -0.4px;
        }
        .gnb__apply {
          padding: 44px 0 0;
        }
        .gnb__apply .btn-apply {
          width: 100%;
          height: 52px;
          font-size: 18px;
          letter-spacing: -0.38px;
        }
        .gnb__char {
          display: block;
          position: absolute;
          right: 8px;
          bottom: 32px;
          width: 156px;
          height: auto;
          pointer-events: none;
        }

        /* Main visual */
        .main-visual__inner {
          padding: 100px 22px 24px;
        }
        .mv-copy {
          gap: 48px;
        }
        .mv-copy__text {
          gap: 24px;
        }
        .mv-copy__eyebrow {
          font-size: 20px;
          line-height: 30px;
          letter-spacing: -0.4px;
        }
        .mv-copy__brand {
          font-size: 55px;
          line-height: 60px;
          letter-spacing: -1.34px;
        }
        .mv-copy__sub {
          font-size: 35px;
          line-height: 44px;
          letter-spacing: -0.86px;
        }
        .mv-copy__period {
          font-size: 13px;
          line-height: 20px;
          letter-spacing: -0.26px;
        }

        .btn-cta {
          width: 200px;
          height: 48px;
          padding: 0 24px;
          font-size: 15px;
          line-height: 22px;
          letter-spacing: -0.3px;
        }

        .mv-stage {
          max-width: 340px;
          margin-top: 24px;
        }
        .mv-stage__glass {
          border-width: 3px;
          filter: blur(3px);
        }

        .btn-scroll {
          bottom: 16px;
          width: 44px;
          height: 44px;
        }
        .btn-scroll svg {
          width: 22px;
          height: 22px;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a class="brand" href="#" aria-label="한미그룹 홈">
          <img
            src="./images/logo_svg.svg"
            alt="Hanmi 한미그룹"
            width="182"
            height="31"
          />
        </a>

        <nav class="gnb" id="gnb" aria-label="주요 메뉴">
          <!-- 모바일 전체메뉴 상단 (모바일에서만 노출) -->
          <div class="gnb__head">
            <a class="brand" href="#" aria-label="한미그룹 홈">
              <img
                src="./images/logo_svg.svg"
                alt="Hanmi 한미그룹"
                width="182"
                height="31"
              />
            </a>
            <button
              class="btn-menu-close"
              type="button"
              id="menuClose"
              aria-label="전체 메뉴 닫기"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M5 5l14 14M19 5L5 19"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>

          <ul class="gnb__list">
            <li class="gnb__item">
              <a class="gnb__link" href="#">직무소개</a>
            </li>
            <li class="gnb__item">
              <a class="gnb__link" href="#">지원자격 및 접수방법</a>
            </li>

    <script>
      (function () {
        var btn = document.getElementById("scrollDown");
        var hero = document.getElementById("main-visual");
        if (btn && hero) {
          btn.addEventListener("click", function () {
            window.scrollTo({ top: hero.offsetHeight, behavior: "smooth" });
          });
        }
        // 모바일 전체메뉴 (오른쪽 슬라이드)
        var html = document.documentElement;
        var gnb = document.getElementById("gnb");
        var openBtn = document.getElementById("menuOpen");
        var closeBtn = document.getElementById("menuClose");
        var mobileMq = window.matchMedia("(max-width: 390px)");

        function openMenu() {
          gnb.classList.add("is-open");
          html.classList.add("is-menu-open"); // 배경 스크롤 방지
          openBtn.setAttribute("aria-expanded", "true");
          closeBtn.focus();
        }
        function closeMenu(restoreFocus) {
          gnb.classList.remove("is-open");
          html.classList.remove("is-menu-open"); // 스크롤 복원
          openBtn.setAttribute("aria-expanded", "false");
          if (restoreFocus) openBtn.focus();
        }

        if (gnb && openBtn && closeBtn) {
          openBtn.addEventListener("click", openMenu);
          closeBtn.addEventListener("click", function () {
            closeMenu(true);
          });
          gnb.querySelectorAll("a").forEach(function (a) {
            a.addEventListener("click", function () {
              closeMenu(false);
            });
          });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && gnb.classList.contains("is-open"))
              closeMenu(true);
          });
          // 모바일 범위를 벗어나면(회전/리사이즈) 메뉴 상태 초기화
          var onChange = function (e) {
            if (!e.matches) closeMenu(false);
          };
          if (mobileMq.addEventListener)
            mobileMq.addEventListener("change", onChange);
          else mobileMq.addListener(onChange);
        }

        // 디자인 단계: 빈 앵커(#) 클릭 시 페이지 상단 점프 방지
        document.querySelectorAll('a[href="#"]').forEach(function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
          });
        });
      })();
    </script>
