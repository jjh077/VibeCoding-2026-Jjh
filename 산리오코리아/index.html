<!doctype html>
<html>
  <head>
    <title>산리오 코리아 홍홍</title>
    <meta charset="UTF-8" />
    <!-- 인터널스타일시트(internal style sheet) -->
    <!-- 상단영역 스타일 (Top Area Styles) -->
    <style>
      /* 웹폰트 로딩하기(CDN방식)
        CDN은 Content Delivery Networt 즉, 네트워크 망으로 컨텐트를 배달시켜 쓰는 방식 */

      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nanum+Gothic&display=swap");

      @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumBarunGothic@1.0/nanumbarungothicsubset.css");

      /* 전체 루트 설정 */
      html {
        /* rem단위를 위한 Root 글자크기설정 */
        font-size: 10px;
        /* 왜 10px인가? rem단위에 계산이 용이함! */
      }
      html,
      body {
        /* 웹폰트체 지정 (콤마는 우선순위) */
        font-family: Montserrat, NanumBarunGothic, Dotum, sans-serif;
      }
      /* 공통요소 초기화 */
      html,
      body,
      div,
      span,
      applet,
      object,
      iframe,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      blockquote,
      pre,
      a,
      abbr,
      acronym,
      address,
      big,
      cite,
      code,
      del,
      dfn,
      em,
      img,
      ins,
      kbd,
      q,
      s,
      samp,
      small,
      strike,
      strong,
      sub,
      sup,
      tt,
      var,
      b,
      u,
      i,
      center,
      dl,
      dt,
      dd,
      ol,
      ul,
      li,
      fieldset,
      form,
      label,
      legend,
      table,
      caption,
      tbody,
      tfoot,
      thead,
      tr,
      th,
      td,
      article,
      aside,
      canvas,
      details,
      embed,
      figure,
      figcaption,
      footer,
      header,
      hgroup,
      menu,
      nav,
      output,
      ruby,
      section,
      summary,
      time,
      mark,
      audio,
      video {
        margin: 0;
        padding: 0;
      }
      .header-inner {
        display: flex;
        max-width: 1440px;
        margin: 0 auto;
        align-items: center;
        justify-content: space-between;
        height: 90px;
      }
      .logo-box {
        flex-shrink: 0;
      }
      .logo-box img {
        height: 56px; /* 로고 이미지 높이 고정 */
      }
      .menu-list {
        display: flex;
        gap: 32px;
        margin: 0 20px 0 0;
        padding: 0;
        list-style: none;
        align-items: center;
        text-transform: uppercase; /* 대문자 변환 */
      }
      .menu-link {
        text-decoration: none;
        color: #333;
        font-size: 1.6rem;
        padding: 6px 12px;
        transition: color 0.2s;
      }
      .menu-link:hover {
        color: #ff69b4;
      }
      /* 배너 영역 스타일 */
      #banner-section {
        background: url("./images/main_visual_bg.jpg") repeat 0 0/50px;
        /* 배경스타일 사용법:
        background: 색 이 반 고 윙/크
        background: 배경색 이미지 반복 고정 위치/크기 */
      }
      .main-visual-box {
        text-align: center;
        margin: 0 auto 0 auto;
        justify-content: center;
        padding: 80px;
        padding-bottom: 160px;
        align-items: center;
      }
      .main-visual-img {
        width: 984px;
        max-width: 100%;
        object-fit: contain;
      }
      /* SNS 버튼 박스 스타일 */
      .sns {
        display: flex; /* 아이콘을 flex로 배치 */
        flex-direction: column; /* 세로 정렬 */
        position: absolute; /* 부모 영역에서 위치 지정 */
        top: 50px; /* 위쪽에서 50px 떨어짐 */
        right: 50px; /* 오른쪽에서 50px 떨어짐 */
      }
      .sns img {
        width: 40px;
        height: 40px;
      }

      /* 스크롤 유도 애니 버튼박스 */
      .scroll_btn {
        position: absolute;
        bottom: 50px;
        left: 50%;
        translate: -50%;
        width: 79px;
        height: 70px;
        /* outline: 2px solid blue; */
      }
      /* 마우스 글자박스 */
      .scroll_btn p {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        text-transform: uppercase;
        font-size: 1rem;
      }
      /* 움직일 대상 마우스 */
      .scroll_btn .mouse {
        position: absolute;
        left: 50%;
        translate: -50%;
        top: 0px;
        display: block;
        width: 26px;
        height: 36px;
        background-color: #fff;
        border: 1px solid #222;
        border-radius: 15px;
        /* 애니메이션 호출 : (이시이지반방마)
        이름 시간 이징 지연시간 반복 방향 마지막상태 */
        animation: mouse-ani 0.9s ease-in-out infinite alternate;
      }
      /* 마우스 애니메이션 키프레임 */
      @keyframes mouse-ani {
        /* 시작값  from이 처음 셋팅값과 같으면 생략가능 */
        from {
          top: 0;
        }
        to {
          top: 15px;
        }
      }
      .scroll_btn .mouse span {
        position: absolute;
        top: 27%;
        left: 50%;
        translate: -50% -50%;
        width: 5px;
        height: 5px;
        background-color: #222;
        border-radius: 50%;
        opacity: 0;
        /* 마우스휠 키프레임 호출 : 이시이지반방마 */
        animation: mouse-dot-ani 1.5s linear infinite;
      }
      /* 마우스휠 애니메이션 키프레임 */
      @keyframes mouse-dot-ani {
        0% {
          opacity: 0;
          top: 27%;
        }
        10% {
          opacity: 1;
          top: 27%;
        }
        40% {
          opacity: 1;
          top: 50%;
        }
        60% {
          opacity: 0;
          top: 50%;
        }
        100% {
          opacity: 0;
          top: 50%;
        }
      }

      /* 캐리터영역 박스 */
      .character-section {
        height: 100vh;
      }

      /* 공통타이틀박스 */
      .tit-box {
        max-width: 1200px;
        margin: 0 auto;
        outline: 3px dashed blue;
      }

      /* 타이틀파트 */
      .tit-box .part-tit {
        text-align: center;
        padding: 40px 0;
        font-size: 5rem;
        font-weight: normal;
      }

      /* 타이틀박스 하위 버튼박스 */
      .btn-box {
        text-align: center;
        padding: 20px 0;
      }

      .btn-view {
        text-decoration: none;
        color: #222;
        font-size: 2rem;
        display: inline-block;
        margin: 0 auto;
        border: 1px solid #222;
        border-radius: 24px;
        padding: 10px 23px;
      }
    </style>
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <header id="site-header">
      <!-- 헤더 내부 컨테이너(로고와 네비게이션 정렬 역할) -->
      <section class="header-inner">
        <!-- 로고 박스(좌측) -->
        <aside class="logo-box">
          <!-- 사이트 대표 로고 이미지 -->
          <img
            src="./images/logo_2023.png"
            alt="Sanrio Korea Logo"
            class="site-logo"
          />
        </aside>
        <!-- 내비게이션(메인 메뉴) 영역 -->
        <nav>
          <!-- 메뉴 리스트(네비게이션 링크들을 포함) -->
          <ul class="menu-list">
            <!-- 회사 소개 섹션으로 이동 -->
            <li><a href="#company-section" class="menu-link">company</a></li>
            <!-- 캐릭터 소개 섹션으로 이동 -->
            <li>
              <a href="#character-section" class="menu-link">character</a>
            </li>
            <!-- 장소 소개 섹션으로 이동 -->
            <li><a href="#place-section" class="menu-link">place</a></li>
            <!-- 채용 정보 섹션으로 이동 -->
            <li><a href="#recruit-section" class="menu-link">recruit</a></li>
          </ul>
        </nav>
      </section>
    </header>

    <!-- 2. 메인영역 -->
    <main id="site-main">
      <!-- 2-1. 배너영역 -->
      <section id="banner-section" style="position: relative">
        <!-- 배너영역 내용 -->
        <figure class="main-visual-box">
          <img
            src="./images/main_visual_pc_v1.png"
            alt="메인 비주얼"
            class="main-visual-img"
          />
        </figure>

        <!-- SNS이동버튼박스 -->
        <div class="sns">
          <a href="https://www.instagram.com/sanrio_kr/" target="_blank"
            ><img src="./images/i_ins_pc_v3.png" alt="instargram"
          /></a>
          <a
            href="https://www.youtube.com/c/sanriokorea/featured"
            target="_blank"
            ><img src="./images/i_you_pc_v3.png" alt="youtube"
          /></a>
        </div>

        <!-- 스크롤 유도 애니박스 -->
        <div class="scroll_btn">
          <span class="mouse"><span></span></span>
          <p>scroll down</p>
        </div>
      </section>

      <!-- 2-2. 캐릭터영역 -->
      <section id="character-section">
        <!-- 캐릭터영역 내용 -->
        <div class="tit-box">
          <h2 class="part-tit">character</h2>
          <div class="btn-box">
            <a href="#" class="btn-view">view more</a>
          </div>
        </div>
      </section>
      <!-- 2-3. 컴퍼니영역 -->
      <section id="company-section">
        <!-- 컴퍼니영역 내용 -->
      </section>
      <!-- 2-4. 리쿠르트영역 -->
      <section id="recruit-section">
        <!-- 리쿠르트영역 내용 -->
      </section>
      <!-- 2-5. 플레이스영역 -->
      <section id="place-section">
        <!-- 플레이스영역 내용 -->
      </section>
      <!-- 2-6. 컨텍어스영역 -->
      <section id="contactus-section">
        <!-- 컨텍어스영역 내용 -->
      </section>
    </main>

    <!-- 3. 하단영역 -->
    <footer id="site-footer">
      <!-- 하단영역 내용 -->
    </footer>
  </body>
</html>
